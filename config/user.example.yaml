# QuantSim 本机覆盖配置（示例）
#
# 用法：把本文件复制为同目录下的 `user.yaml`（不要直接改 default.yaml），
# 只写「这台机器跟别人不一样」的项即可。结构与 config/default.yaml 完全一致，
# 采用**深度合并**：这里写什么就覆盖什么，没写的沿用 default.yaml 与代码默认值。
#
# 优先级：代码默认值 < config/default.yaml < config/user.yaml < 环境变量
#
# ⚠️ user.yaml 已在 .gitignore 中忽略，不会被提交，也不会被软件升级覆盖。
#
# 提示：数据目录也可以在 UI 里改 ——「系统设置 → 交易设置 → 存储与路径」，
# 那里会帮你创建目录、做写入测试并自动写回本文件。

# ---- 数据目录（留空/删除本项 = 使用软件目录下的 data/）----
# 必须是**绝对路径**；适合把行情库放到大盘或移动硬盘。
# 注意：修改后需重启后端；已有的 quant.db / market/ 不会自动迁移。
# data_dir: D:\QuantSimData

# ---- 后端监听 ----
# api_host: 127.0.0.1
# api_port: 8000

# ---- 逐渠道代理模式：auto（跟随系统）/ direct（强制直连）/ proxy（强制走代理）----
# 国内源走代理常超时，国外源（yfinance）通常必须走代理。
# 也可以在 UI 里改：「系统设置 → 交易设置 → 数据源代理」（立即生效，无需重启）。
# data:
#   proxy: default
# providers:
#   baostock: direct
#   akshare: direct
#   tencent: direct
#   yfinance: auto

# ---- LLM 接口（也可以只配环境变量 LLM_API_KEY / LLM_BASE_URL / LLM_MODEL）----
# llm:
#   base_url: https://api.deepseek.com
#   api_key: sk-xxxx
#   model: deepseek-chat
#   timeout_seconds: 60

# ---- 日志 ----
# log_level: INFO
