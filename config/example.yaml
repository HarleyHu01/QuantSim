# QuantSim 完整示例配置（带注释）
# 使用：复制为 config/custom.yaml 或直接修改 default.yaml
# 优先级：代码默认值 < default.yaml < custom.yaml（若支持）< 环境变量（.env）
# ---------------------------------------------------------------------------

log_level: INFO          # DEBUG | INFO | WARNING | ERROR
api_host: 127.0.0.1      # API 监听地址（局域网访问可改 0.0.0.0）
api_port: 8000           # FastAPI 端口（start.bat 固定使用）

# ================= 数据源 =================
data:
  timezone: UTC           # 行情统一存储时区（内部统一 UTC，展示时按 display_timezone）
  display_timezone: null  # UI 展示时区；null = 使用本机时区；可指定 Asia/Shanghai
  adjust: qfq             # A股复权：qfq 前复权 | hfq 后复权 | none 不复权
  lookback_days: 730      # 首次拉取/全量重刷的历史天数
  incremental: true       # 默认增量更新（按最后 bar 续拉，含 2 根重叠去重）
  default_timeframes: ["1d"]   # 一键更新的默认周期（1m/5m/15m/30m/1h/2h/4h/1d/1w/1M）
                             # 注意：baostock 支持 5m/15m/30m/60m(1h)/1d/1w/1M，不支持 1m/2h/4h

  # ---- 代理与网络 ----
  akshare_use_proxy: false   # akshare（A股备用源/期货，东方财富等国内源）禁用系统代理直连；
                             #   系统代理（如 Clash）会拦截国内域名导致失败。
                             #   你的网络必须走代理才能访问国内源时改为 true。
                             #   baostock 经官方客户端 TCP 直连服务器，不受 HTTP 代理影响。
  ccxt_exchanges: [okx, bitget, gateio, binance, bybit, kucoin]
                             # 加密货币交易所 fallback 链（逐个尝试，命中即缓存）。
                             # 国内网络/代理对不同交易所可达性不同，按需调整，
                             # 如 [okx, gateio, huobi] 或 [binance, kucoin, kraken]。
  ccxt_timeout_ms: 5000      # 单交易所请求超时（毫秒）；健康检查另有 5s 总预算

  # ---- 数据源优先级（失败/不健康自动切下一个） ----
  providers:
    priority:
      stock:  [baostock, akshare, yfinance]   # A股股票：baostock 主源（官方客户端直连）→
                                              #   akshare（内部东财→腾讯→新浪三通道）→ yfinance 兜底。
                                              #   美股等非 A股代码在 baostock/akshare 处快速校验失败后
                                              #   落到 yfinance；纯美股用户可改 [yfinance]。
      etf:    [baostock, akshare, yfinance]   # A股 ETF：baostock（数据自 2026-01-05 至今）→
                                              #   akshare → yfinance
      index:  [baostock, akshare, yfinance]   # 指数：baostock 日/周/月线（2006-01-01 至今），
                                              #   无分钟线；分钟线需求自动走 akshare/yfinance
      future: [akshare, yfinance]             # 期货：仅 akshare（baostock 不支持期货）
      crypto: [ccxt]

# ================= 标的池 =================
symbols:
  - {symbol: AAPL, name: Apple, asset_type: stock, source: yfinance}
  - {symbol: MSFT, name: Microsoft, asset_type: stock, source: yfinance}
  - {symbol: SPY, name: SPDR S&P 500 ETF, asset_type: etf, source: yfinance}
  - {symbol: 000001.SZ, name: 平安银行, asset_type: stock, source: baostock}
  - {symbol: 600519.SH, name: 贵州茅台, asset_type: stock, source: baostock}
  - {symbol: 000300.SH, name: 沪深300, asset_type: index, source: baostock}
  - {symbol: 510300.SH, name: 沪深300ETF, asset_type: etf, source: baostock}
  - {symbol: BTC/USDT, name: Bitcoin, asset_type: crypto, source: ccxt}
  - {symbol: ETH/USDT, name: Ethereum, asset_type: crypto, source: ccxt}
  # 备注：UI 数据管理页可随时添加/删除标的（POST /api/data/symbols，自动推断类型）

# ================= LLM（预留，未启用） =================
llm:
  base_url: https://api.deepseek.com
  api_key: ""              # 建议用 .env 的 LLM_API_KEY（不写进 yaml）
  model: deepseek-chat     # deepseek-chat(V3) | deepseek-reasoner(R1)
  timeout_seconds: 60
  max_retries: 3
  temperature: 0.2
  # 说明：策略创建页目前为手动表单；LLM 生成接口已预留（quant/strategies/llm/），
  #       未来接入时只需实现生成器，配置此处的 api_key 即可。
