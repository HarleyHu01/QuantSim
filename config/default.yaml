# QuantSim 默认配置（优先级：代码默认值 < 本文件 < .env）
log_level: INFO
api_host: 127.0.0.1
api_port: 8000

data:
  timezone: UTC            # 行情统一存储时区
  display_timezone: null   # UI 展示时区，null = 本地时区
  adjust: qfq              # A股复权: qfq 前复权 | hfq 后复权 | none 不复权
  lookback_days: 730       # 首次拉取历史天数
  incremental: true        # 默认增量更新
  default_timeframes: ["1d"]
  akshare_use_proxy: false # akshare 兼容开关（当前实现不改写代理环境变量，见 data/akshare_provider.py）

  # 三个不同的下载渠道，按顺序逐级尝试：前一个失败/不支持才换下一个。
  # 腾讯是「最后兜底」，不要在它前面插入其它源，否则会变成每源都拉一遍。
  providers:
    stock:  [baostock, akshare]   # A股：baostock（主）→ akshare（备选，内部东财→腾讯→新浪）
    etf:    [baostock, akshare]   # ETF：同上
    index:  [baostock, akshare]   # 指数：baostock 无分钟线，自动跳到 akshare
    us_stock: [yfinance]                   # 美股/海外 ETF：Yahoo

symbols:
  - {symbol: AAPL,       name: Apple,           asset_type: stock, source: yfinance}
  - {symbol: MSFT,       name: Microsoft,       asset_type: stock, source: yfinance}
  - {symbol: SPY,        name: SPDR S&P 500 ETF, asset_type: etf,  source: yfinance}
  - {symbol: 000001.SZ,  name: 平安银行,         asset_type: stock, source: baostock}
  - {symbol: 600519.SH,  name: 贵州茅台,         asset_type: stock, source: baostock}
  - {symbol: 000300.SH,  name: 沪深300,          asset_type: index, source: baostock}
  - {symbol: 510300.SH,  name: 沪深300ETF,       asset_type: etf,   source: baostock}
  - {symbol: ^GSPC,      name: 标普500指数,       asset_type: index, source: yfinance}
  - {symbol: BTC-USD,    name: Bitcoin,          asset_type: stock, source: yfinance}

llm:
  base_url: https://api.deepseek.com
  api_key: ""              # 建议用 .env 的 LLM_API_KEY
  model: deepseek-chat     # deepseek-chat(V3) | deepseek-reasoner(R1)
  api_protocol: openai     # openai(兼容) | anthropic(Claude) | gemini(Google)
  timeout_seconds: 60
  max_retries: 3
  temperature: 0.2

ml:
  kronos:
    enabled: true            # 关闭后 Kronos 策略/页面会提示未启用
    model: Kronos-small      # Kronos-mini(4.1M, ctx2048) | Kronos-small(24.7M, ctx512) | Kronos-base(102.3M, ctx512)
    tokenizer: ""             # 留空按 model 自动配对；也可填 NeoQuasar/Kronos-Tokenizer-2k
    device: auto             # auto | cpu | cuda:0
    max_context: 512         # 上下文 K 线根数上限（mini 可到 2048）
    pred_len: 12             # 每次预测未来多少根
    temperature: 1.0         # 采样温度，越低越保守
    top_p: 0.9
    sample_count: 1          # 采样次数，>1 会取均值（更稳但更慢）
    tz: Asia/Shanghai        # 时间特征用的时区（Kronos 依赖 时/分/周/月 特征）
